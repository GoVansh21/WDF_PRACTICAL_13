<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 25px;
        }

        .container {
            max-width: 950px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #ccc;
        }

        h1, h2 {
            color: #234b80;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 10px;
            margin: 7px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 9px 14px;
            margin: 4px;
            border: none;
            border-radius: 5px;
            color: white;
            background: #2463a6;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .delete {
            background: #d93636;
        }

        .cancel {
            background: #666;
        }

        .message {
            padding: 10px;
            margin: 12px 0;
            border-radius: 5px;
        }

        .success {
            background: #e0f7e9;
            color: #12652b;
        }

        .error {
            background: #ffe5e5;
            color: #a00000;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #e8eef7;
        }
    </style>
</head>

<body>
<div class="container">

    <h1>Student Management System</h1>

    <h2 id="formTitle">Add Student</h2>

    <form id="studentForm">
        <input type="hidden" id="studentId">

        <input type="text" id="name"
               placeholder="Student Name"
               maxlength="100" required>

        <input type="email" id="email"
               placeholder="Email Address"
               maxlength="150" required>

        <input type="text" id="course"
               placeholder="Course Name"
               maxlength="100" required>

        <button type="submit" id="saveBtn">
            Add Student
        </button>

        <button type="button" class="cancel"
                id="cancelBtn" hidden>
            Cancel
        </button>
    </form>

    <div id="message" class="message"
         role="status" aria-live="polite" hidden></div>

    <h2>Student Records</h2>

    <input type="search" id="search"
           placeholder="Search students by name, email, or course">

    <p id="loading" hidden>Loading records...</p>

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Course</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="studentList"></tbody>
        </table>
    </div>

</div>

<script>
const api = "api.php";

const form = document.getElementById("studentForm");
const list = document.getElementById("studentList");
const message = document.getElementById("message");
const loading = document.getElementById("loading");
const saveBtn = document.getElementById("saveBtn");
const search = document.getElementById("search");

let students = [];
let searchTimer;

function showMessage(text, isError = false) {
    message.textContent = text;
    message.className =
        "message " + (isError ? "error" : "success");
    message.hidden = false;
}

function clearMessage() {
    message.hidden = true;
}

// Common Fetch API request function
async function request(url, options = {}) {
    const response = await fetch(url, options);

    let result;

    try {
        result = await response.json();
    } catch {
        throw new Error("Server returned invalid JSON.");
    }

    if (!response.ok || result.success !== true) {
        throw new Error(result.message || "Request failed.");
    }

    return result;
}

// READ and SEARCH students
async function loadStudents(query = "") {
    loading.hidden = false;

    try {
        const result = await request(
            api + "?search=" + encodeURIComponent(query)
        );

        students = result.data;
        renderStudents();
    } catch (error) {
        students = [];
        renderStudents();
        showMessage(error.message, true);
    } finally {
        loading.hidden = true;
    }
}

// Display students in the table
function renderStudents() {
    list.replaceChildren();

    if (students.length === 0) {
        const row = document.createElement("tr");
        const cell = document.createElement("td");

        cell.colSpan = 5;
        cell.textContent = "No students found.";

        row.appendChild(cell);
        list.appendChild(row);
        return;
    }

    students.forEach(student => {
        const row = document.createElement("tr");

        [
            student.id,
            student.name,
            student.email,
            student.course
        ].forEach(value => {
            const cell = document.createElement("td");
            cell.textContent = value;
            row.appendChild(cell);
        });

        const actions = document.createElement("td");

        const editBtn = document.createElement("button");
        editBtn.textContent = "Edit";
        editBtn.addEventListener("click", () => {
            editStudent(student);
        });

        const deleteBtn = document.createElement("button");
        deleteBtn.textContent = "Delete";
        deleteBtn.className = "delete";
        deleteBtn.addEventListener("click", () => {
            deleteStudent(student.id);
        });

        actions.append(editBtn, deleteBtn);
        row.appendChild(actions);
        list.appendChild(row);
    });
}

// CREATE and UPDATE student
form.addEventListener("submit", async function(event) {
    event.preventDefault();
    clearMessage();

    const id = document.getElementById("studentId").value;

    const data = {
        action: id ? "update" : "add",
        name: document.getElementById("name").value.trim(),
        email: document.getElementById("email").value.trim(),
        course: document.getElementById("course").value.trim()
    };

    if (id) {
        data.id = Number(id);
    }

    if (!data.name || !data.email || !data.course) {
        showMessage("Please fill in all fields.", true);
        return;
    }

    saveBtn.disabled = true;
    saveBtn.textContent = "Saving...";

    try {
        const result = await request(api, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        });

        showMessage(result.message);
        resetForm();
        await loadStudents(search.value.trim());

    } catch (error) {
        showMessage(error.message, true);

    } finally {
        saveBtn.disabled = false;
        saveBtn.textContent =
            document.getElementById("studentId").value
                ? "Update Student"
                : "Add Student";
    }
});

// Fill the form for editing
function editStudent(student) {
    document.getElementById("studentId").value = student.id;
    document.getElementById("name").value = student.name;
    document.getElementById("email").value = student.email;
    document.getElementById("course").value = student.course;

    document.getElementById("formTitle").textContent =
        "Edit Student";

    saveBtn.textContent = "Update Student";
    document.getElementById("cancelBtn").hidden = false;

    clearMessage();
    window.scrollTo({ top: 0, behavior: "smooth" });
}

// DELETE student
async function deleteStudent(id) {
    if (!confirm("Are you sure you want to delete this student?")) {
        return;
    }

    clearMessage();

    try {
        const result = await request(api, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                action: "delete",
                id: Number(id)
            })
        });

        showMessage(result.message);
        await loadStudents(search.value.trim());

    } catch (error) {
        showMessage(error.message, true);
    }
}

// Reset the form
function resetForm() {
    form.reset();

    document.getElementById("studentId").value = "";
    document.getElementById("formTitle").textContent =
        "Add Student";

    saveBtn.textContent = "Add Student";
    document.getElementById("cancelBtn").hidden = true;
}

// Cancel editing
document.getElementById("cancelBtn")
    .addEventListener("click", function() {
        resetForm();
        clearMessage();
    });

// AJAX search with debounce
search.addEventListener("input", function() {
    clearTimeout(searchTimer);

    searchTimer = setTimeout(() => {
        loadStudents(search.value.trim());
    }, 300);
});

// Load records when the page opens
loadStudents();
</script>

</body>
</html>
